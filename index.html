<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catatan keamanan siber, pentest, bug bounty, Active Directory, privilege escalation, web dan API.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self';">
  <title>cybersecurity-notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="header-left">
    <span class="prompt" id="typewriter" aria-live="polite"></span><span class="cursor" aria-hidden="true">_</span>
  </div>
  <div class="header-right">
    <nav class="view-switch" aria-label="Navigasi utama">
      <button class="nav-btn active" data-view="commands" type="button">[ COMMAND ]</button>
      <button class="nav-btn" data-view="methodology" type="button">[ METODOLOGI ]</button>
    </nav>
    <div class="theme-switcher" id="theme-switcher">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Pilih tema" aria-expanded="false">🎨</button>
      <div class="theme-dropdown" id="theme-dropdown" role="menu">
        <button data-theme="violet" type="button"><span class="swatch swatch-violet"></span>Violet Elektrik</button>
        <button data-theme="green" type="button"><span class="swatch swatch-green"></span>Hijau Matrix</button>
        <button data-theme="cyan" type="button"><span class="swatch swatch-cyan"></span>Cyan Siber</button>
        <button data-theme="amber" type="button"><span class="swatch swatch-amber"></span>Amber Terminal</button>
        <button data-theme="red" type="button"><span class="swatch swatch-red"></span>Merah Laser</button>
        <button data-theme="pink" type="button"><span class="swatch swatch-pink"></span>Pink Neon</button>
      </div>
    </div>
  </div>
</header>

<main id="view-commands" class="view active-view">
  <div class="toolbar">
    <input type="search" id="search-input" placeholder="> grep -i 'cari command, tag, alasan...'" autocomplete="off" aria-label="Cari command">
    <button id="add-command-btn" class="btn-primary" type="button">[+ ADD_COMMAND]</button>
  </div>
  <div class="filter-bar" id="filter-bar" aria-label="Filter kategori">
    <button class="filter-btn active" data-cat="all" type="button">SEMUA</button>
    <button class="filter-btn" data-cat="recon" type="button">01_RECON &amp; WEB</button>
    <button class="filter-btn" data-cat="ad" type="button">02_ACTIVE DIRECTORY</button>
    <button class="filter-btn" data-cat="privesc" type="button">03_PRIVILEGE ESCALATION</button>
    <button class="filter-btn" data-cat="webapp" type="button">04_WEBAPP / API</button>
  </div>
  <div class="results-count" id="results-count" aria-live="polite"></div>
  <div id="command-grid" class="command-grid"></div>
</main>

<main id="view-methodology" class="view">
  <div class="methodology-header">
    <h2>// METODOLOGI &amp; CHECKLIST</h2>
  </div>
  <div id="checklist-container"></div>
</main>

<div id="add-modal" class="modal-overlay" aria-hidden="true">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-title" id="modal-title">// ADD_COMMAND</div>
    <form id="add-command-form">
      <label for="f-title">JUDUL</label>
      <input type="text" id="f-title" required maxlength="120" placeholder="contoh: Enumerasi LDAP">
      <label for="f-category">KATEGORI</label>
      <select id="f-category" required>
        <option value="recon">01 RECON &amp; WEB ENUM</option>
        <option value="ad">02 ACTIVE DIRECTORY</option>
        <option value="privesc">03 PRIVILEGE ESCALATION</option>
        <option value="webapp">04 WEBAPP / API</option>
      </select>
      <label for="f-command">COMMAND</label>
      <textarea id="f-command" required maxlength="4000" rows="4" placeholder="Command..."></textarea>
      <label for="f-why">MENGAPA?</label>
      <textarea id="f-why" required maxlength="2000" rows="3" placeholder="Apa tujuan command ini?"></textarea>
      <label for="f-lookfor">YANG DICARI</label>
      <textarea id="f-lookfor" required maxlength="2000" rows="3" placeholder="Output atau indikator apa yang dicari?"></textarea>
      <label for="f-tags">TAG (pisahkan dengan koma)</label>
      <input type="text" id="f-tags" maxlength="300" placeholder="ldap, enum, active-directory">
      <div class="modal-actions">
        <button type="button" id="cancel-add-btn" class="btn-secondary">BATAL</button>
        <button type="submit" class="btn-primary">SIMPAN</button>
      </div>
    </form>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="script.js" defer></script>
</body>
</html>
